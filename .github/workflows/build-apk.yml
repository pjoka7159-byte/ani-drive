name: Build ANI DRIVE APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "index.html"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANI Drive
          path: android/app/build/outputs/apk/debug/ANI Drive.apk
          if-no-files-found: error

      - name: Publish APK download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "app/build/outputs/apk/debug/ANI Drive.apk" "app/build/outputs/apk/debug/ANI-Drive.apk"
          gh release create android-latest "app/build/outputs/apk/debug/ANI-Drive.apk" --repo "${GITHUB_REPOSITORY}" --title "ANI DRIVE Android" --notes "Latest ANI DRIVE Android application" --latest || gh release upload android-latest "app/build/outputs/apk/debug/ANI-Drive.apk" --repo "${GITHUB_REPOSITORY}" --clobber
