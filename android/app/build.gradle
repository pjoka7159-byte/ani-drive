plugins { id 'com.android.application' }

android {
    namespace 'am.anidrive.app'
    compileSdk 35

    defaultConfig {
        applicationId 'am.anidrive.app'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = 'ANI Drive.apk'
        }
    }
}
